name: Update VPNBook catalog

on:
  workflow_dispatch:
  schedule:
  - cron: "17 0 * * *"
  - cron: "17 3 * * *"
  - cron: "17 6 * * *"
  - cron: "17 9 * * *"
  - cron: "17 12 * * *"
  - cron: "17 15 * * *"
  - cron: "17 18 * * *"
  - cron: "17 21 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update catalog
        run: python3 scripts/update_vpnbook.py

      - name: Validate catalog
        run: |
          python3 -m json.tool public/servers.json >/dev/null
          python3 - <<'PY'
          import json, re
          d = json.load(open("public/servers.json", encoding="utf-8"))
          assert d["source"] == "VPNBook"
          assert d["username"] == "vpnbook"
          assert re.fullmatch(r"[A-Za-z0-9]{5,32}", d["password"])
          assert len(d["servers"]) >= 5
          assert set(d["protocols"]) == {"tcp443", "tcp80", "udp53", "udp25000"}
          for s in d["servers"]:
              assert s["host"].endswith(".vpnbook.com")
              assert set(s["configs"]) == set(d["protocols"])
              for p in d["protocols"]:
                  assert s["configs"][p]["config"].startswith("client")
          PY

      - name: Commit only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/servers.json
          if git diff --cached --quiet; then
            echo "VPNBook catalog unchanged"
            exit 0
          fi
          git commit -m "chore: update VPNBook catalog"
          git push
